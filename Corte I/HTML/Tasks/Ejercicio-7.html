<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 — Formularios avanzados</title>
</head>
<body>
    <h1>Formulario De Inscripción Universitaria</h1>

  
<select id="carrera" name="carrera">
    <option value="sistemas">Ingeniería de Sistemas</option>
    <option value="software">Desarrollo de Software</option>
</select>

<br><br>

<input type="radio" name="genero" value="masculino"> Masculino
<input type="radio" name="genero" value="femenino"> Femenino

<br><br>


<input type="checkbox" name="habilidades" value="html"> HTML
<input type="checkbox" name="habilidades" value="css"> CSS

<br><br>

<input type="file" id="foto" name="foto">

<br><br>

<textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>

<br><br>


<input type="date" id="fecha" name="fecha">

<br><br>


<input type="number" id="edad" name="edad" min="18" max="99">
</body>
</html>
